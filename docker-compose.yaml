version: "3.9"

services:
  app:
    build:
      context: ./app
    container_name: sveltekit_app
    ports:
      - "3000:3000"
#    environment:
#      DATABASE_URL: ${DATABASE_URL}
#      PUBLIC_SOCKET_URL: http://server:3001
    env_file:
      - .env
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: socket_server
    ports:
      - "3001:3001"
    restart: unless-stopped